services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: api_platform
    ports:
      - '${POSTGRES_HOST_PORT:-5441}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U app -d api_platform']
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - '${REDIS_HOST_PORT:-6380}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 20

  # One-off job: applies migrations and seeds tiers, then exits.
  migrate:
    build:
      context: .
      target: build
    command: sh -c "npx prisma migrate deploy && npx prisma db seed"
    environment:
      DATABASE_URL: postgresql://app:app@postgres:5432/api_platform
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    env_file: .env
    environment:
      # Overrides for running inside the container network, as a production build.
      NODE_ENV: production
      DATABASE_URL: postgresql://app:app@postgres:5432/api_platform
      REDIS_URL: redis://redis:6379/0
      SECRETS_SOURCE: local
    ports:
      - '${API_HOST_PORT:-3000}:3000'
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  pgdata:
